<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobile preview 390×844</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  display:grid;
  place-items:center;
  background:#111;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.label{color:#777;font-size:12px}
.phone{
  width:390px;height:844px;
  overflow:hidden;background:#000;
  border:1px solid #333;border-radius:28px;
  box-shadow:0 18px 70px rgba(0,0,0,.55);
}
iframe{width:390px;height:844px;border:0;display:block;background:#000}
@media(max-width:430px){
  .label{display:none}
  .phone,iframe{width:100vw;height:100svh;border:0;border-radius:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="label">390 × 844 mobile viewport</div>
  <div class="phone"><iframe src="index.html"></iframe></div>
</div>
</body>
</html>
